[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["migrations", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["apps", "config"]
skip = ["migrations"]
