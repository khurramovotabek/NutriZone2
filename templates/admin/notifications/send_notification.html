{% extends "admin/base_site.html" %}

{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Send</button>
        <a href="{% url 'admin:notifications_notification_changelist' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
