name: nutrizone

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrizone}
      POSTGRES_USER: ${POSTGRES_USER:-nutrizone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrizone}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    stop_grace_period: 30s
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2
      --timeout 60
      --access-logfile -
      --error-logfile -
      "
    environment: *backend-env
    volumes:
      - media_data:/app/media_root
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    stop_grace_period: 30s
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=4
    environment: *backend-env
    volumes:
      - media_data:/app/media_root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery_beat:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    stop_grace_period: 30s
    command: >
      celery -A config beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media_root:ro
      - static_data:/app/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  static_data: