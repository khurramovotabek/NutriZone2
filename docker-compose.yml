name: nutrizone

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.development
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
  DEBUG: "True"
  ALLOWED_HOSTS: "*"
  DATABASE_URL: postgres://nutrizone:nutrizone@postgres:5432/nutrizone
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: http://localhost:3000

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutrizone
      POSTGRES_USER: nutrizone
      POSTGRES_PASSWORD: nutrizone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrizone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    environment: *backend-env
    volumes:
      - .:/app
      - media_data:/app/media_root
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: >
      celery -A config worker --loglevel=info
    environment: *backend-env
    volumes:
      - .:/app
      - media_data:/app/media_root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery_beat:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: >
      celery -A config beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    volumes:
      - .:/app
      - media_data:/app/media_root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media_root:ro
      - static_data:/app/staticfiles:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  static_data: